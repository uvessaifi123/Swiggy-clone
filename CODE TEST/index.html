
<!DOCTYPE html>
<html>
<head>
    <title>Swiggy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Swiggy</h1>

    <div>
        <button>Login</button>
        <button>Sign Up</button>
    </div>
</header>

<div class="main">

    <h1>Hungry?</h1>
    <h2>Order food from your favourite restaurants.</h2>

    <input type="text" placeholder="Enter your location">
    <button>Find Food</button>

    <h2>What's on your mind?</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300" alt="Pizza">
            <h3>Pizza</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300" alt="Burger">
            <h3>Burger</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=300" alt="Noodles">
            <h3>Noodles</h3>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=300" alt="Cake">
            <h3>Cake</h3>
        </div>

    </div>

    <h2>Popular Restaurants</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300" alt="Pizza Palace">
            <h3>Pizza Palace</h3>
            ⭐ 4.2
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?w=300" alt="Burger House">
            <h3>Burger House</h3>
            ⭐ 4.5
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300" alt="Spicy Kitchen">
            <h3>Spicy Kitchen</h3>
            ⭐ 4.1
        </div>

    </div>

</div>

</body>
</html>
